<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>設定</title>
  <meta name="description" content="クリアランプ記録のデータを管理するページです。">
  <link rel="canonical" href="https://cpi-next.com/settings.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cpi-next.com/settings.html">
  <meta property="og:site_name" content="CPI:Next">
  <meta property="og:title" content="設定">
  <meta property="og:description" content="クリアランプ記録のデータを管理するページです。">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary">
  <!-- Google Analytics -->
  <script defer src="analytics.js?v=20260831-3"></script>
  <link rel="stylesheet" href="styles.css?v=20260831-5">
  <link rel="stylesheet" href="settings.css?v=20260831-3">
  <link rel="stylesheet" href="menu.css">
  <script defer src="menu.js?v=20260830-2"></script>
  <script defer src="settings.js?v=20260831-5"></script>
</head>
<body data-page="settings">
  <main class="app">
    <header class="masthead">
      <div class="masthead__bar">
        <div class="site-menu" id="menuRoot">
          <button
            id="menuButton"
            class="menu-button"
            type="button"
            aria-label="メニューを開く"
            aria-controls="siteMenu"
            aria-expanded="false"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div id="siteMenu" class="menu-popover" hidden>
            <button type="button" class="menu-item" data-page="main" data-href="index.html">Pred難易度表</button>
            <button type="button" class="menu-item" data-page="about" data-href="about.html">About</button>
            <button type="button" class="menu-item" data-page="diagnosis" data-href="diagnosis.html">適正診断</button>
            <button type="button" class="menu-item" data-page="history" data-href="history.html">サイト更新履歴</button>
            <button type="button" class="menu-item" data-page="settings" data-href="settings.html">設定</button>
          </div>
        </div>
        <h1>設定</h1>
      </div>
    </header>

    <section class="view view--settings" aria-live="polite">
      <div class="panel settings-panel">
        <div class="settings-heading">
          <h2>登録クリアランプ管理</h2>
        <p class="settings-note">インポートすると、現在のクリアランプ記録はバックアップの内容に置き換わります。</p>
          <p id="settingsRecordCount" class="settings-record-count" aria-live="polite">保存: 確認中...</p>
        </div>

        <div class="settings-actions">
          <button id="settingsExportButton" class="settings-button settings-button--primary" type="button">データをエクスポート</button>
          <button id="settingsImportButton" class="settings-button" type="button">データをインポート</button>
          <button id="settingsResetButton" class="settings-button settings-button--danger" type="button">全データリセット</button>
        </div>
        <input id="settingsImportInput" type="file" accept="application/json,.json" hidden>

                <section class="settings-recommendation" aria-labelledby="settingsRecommendationTitle">
          <h3 id="settingsRecommendationTitle">自動リコメンド設定</h3>
          <p>「これを狙え」の自動リコメンドに表示する条件を設定してください。</p>
          <div class="settings-recommendation-filters">
            <label class="settings-number-filter">
              <span>クリア確率の下限</span>
              <span class="settings-number-input-wrap">
                <input id="settingsRecommendationProbabilityMin" type="number" min="0" max="100" step="1" inputmode="numeric" value="40">
                <span>%</span>
              </span>
            </label>
            <label class="settings-number-filter">
              <span>クリア確率の上限</span>
              <span class="settings-number-input-wrap">
                <input id="settingsRecommendationProbabilityMax" type="number" min="0" max="100" step="1" inputmode="numeric" value="60">
                <span>%</span>
              </span>
            </label>
            <div class="multi-filter settings-recommendation-filter">
              <span>公式レベル</span>
              <details id="settingsRecommendationLevelDetails" class="multi-filter__details">
                <summary id="settingsRecommendationLevelSummary">all</summary>
                <div id="settingsRecommendationLevelOptions" class="multi-filter__options"></div>
              </details>
            </div>
            <div class="multi-filter settings-recommendation-filter">
              <span>Status</span>
              <details id="settingsRecommendationStatusDetails" class="multi-filter__details">
                <summary id="settingsRecommendationStatusSummary">NO PLAY, FAILED, ASSISTED, EASY</summary>
                <div id="settingsRecommendationStatusOptions" class="multi-filter__options"></div>
              </details>
            </div>
          </div>
          <button id="settingsRecommendationResetButton" class="settings-button settings-button--secondary" type="button">デフォルトに戻す</button>
        </section>

        <p id="settingsMessage" class="settings-message" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
</body>
</html>
