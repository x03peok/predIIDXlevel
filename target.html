<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Predと譜面傾向から、次に狙う譜面を探すページです。">

  <meta property="og:type" content="website">
  <meta property="og:title" content="これを狙え">
  <meta property="og:description" content="Predと譜面傾向から、次に狙う譜面を探すページです。">
  <meta property="og:url" content="https://cpi-next.com/target.html">
  <meta property="og:site_name" content="CPI:Next">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-M0BX4638PS"></script>
  <script>

    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-M0BX4638PS');

  <link rel="stylesheet" href="styles.css?v=20260831-4">
  <link rel="stylesheet" href="menu.css?v=20260831-1">
  <link rel="stylesheet" href="target.css?v=20260831-2">
  <script src="menu.js?v=20260831-1" defer></script>
  <script src="data.js?v=20260831-1" defer></script>
  <script src="target.js?v=20260831-3" defer></script>
</head>
<body data-page="target">
  <main class="app">
    <header class="masthead">
      <div class="masthead__bar">
        <div class="site-menu" id="menuRoot">
          <button
            id="menuButton"
            class="menu-button"
            type="button"
            aria-label="メニューを開く"
            aria-controls="siteMenu"
            aria-expanded="false"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div id="siteMenu" class="menu-popover" hidden>
            <button type="button" class="menu-item" data-page="main" data-href="index.html">Pred難易度表</button>
            <button type="button" class="menu-item" data-page="about" data-href="about.html">About</button>
            <button type="button" class="menu-item" data-page="diagnosis" data-href="diagnosis.html">適正診断</button>
            <button type="button" class="menu-item" data-page="history" data-href="history.html">サイト更新履歴</button>
          </div>
        </div>
        <h1>これを狙え</h1>
      </div>
    </header>

    <section class="view view--main" aria-live="polite">
      <div class="panel target-panel">
        <p id="targetInsufficientMessage" class="target-insufficient-message">
          登録譜面数が不足しています。<a href="record.html">クリアランプ登録</a>してください
        </p>
        <div id="targetContent" hidden>
        <div class="toolbar target-toolbar">
          <label class="search">
            <span>Title</span>
            <input id="targetSearchInput" type="search" placeholder="search title" autocomplete="off">
          </label>

          <div class="multi-filter level-filter">
            <span>Level</span>
            <details id="targetLevelFilterDetails" class="multi-filter__details target-filter-details">
              <summary id="targetLevelFilterSummary">all</summary>
              <div id="targetLevelFilterMenu" class="multi-filter__options"></div>
            </details>
          </div>

          <div class="multi-filter bpm-filter">
            <span>Difficulty</span>
            <details id="targetDifficultyFilterDetails" class="multi-filter__details target-filter-details">
              <summary id="targetDifficultyFilterSummary">all</summary>
              <div id="targetDifficultyFilterMenu" class="multi-filter__options"></div>
            </details>
          </div>

          <div class="multi-filter feature-filter">
            <span>Feature</span>
            <details id="targetFeatureFilterDetails" class="multi-filter__details target-filter-details">
              <summary id="targetFeatureFilterSummary">all</summary>
              <div id="targetFeatureFilterMenu" class="multi-filter__options"></div>
            </details>
          </div>

          <details class="multi-filter__details advanced-filter target-filter-details">
            <summary id="targetAdvancedFilterSummary">詳細絞り込み</summary>
            <div class="advanced-filter__body">
              <label class="filter bpm-filter">
                <span>BPM_Min</span>
                <input id="targetBpmMinInput" type="number" inputmode="decimal" min="0" step="any" value="0">
              </label>
              <label class="filter bpm-filter">
                <span>BPM_Max</span>
                <input id="targetBpmMaxInput" type="number" inputmode="decimal" min="0" step="any" value="999">
              </label>
              <label class="filter pred-filter">
                <span>Pred_Min</span>
                <input id="targetPredMinInput" type="number" inputmode="decimal" min="0" max="999" step="0.1" value="0.0">
              </label>
              <label class="filter pred-filter">
                <span>Pred_Max</span>
                <input id="targetPredMaxInput" type="number" inputmode="decimal" min="0" max="999" step="0.1" value="999.0">
              </label>
            </div>
          </details>
        </div>

        <p id="targetError" class="target-error" role="alert" hidden></p>
        <p class="table-hint">曲名をタップすると詳細ページに移動します<br>表は左右にスクロールできます（モバイル表示時）</p>
        <div id="targetRowCount" class="row-count" aria-live="polite"></div>

        <div id="targetTableShell" class="table-shell">
          <table class="target-table">
            <colgroup>
              <col class="col-orig">
              <col class="col-title">
              <col class="col-pred">
              <col class="target-col-adjusted-pred">
              <col class="col-bpm">
              <col class="col-features">
            </colgroup>
            <thead>
              <tr>
                <th><button type="button" data-sort-key="original_level"><span>Level</span><span class="sort-mark"></span></button></th>
                <th><button type="button" data-sort-key="title"><span>Title</span><span class="sort-mark"></span></button></th>
                <th><button type="button" data-sort-key="calibrated_pred_skill"><span>Pred</span><span class="sort-mark"></span></button></th>
                <th><button type="button" data-sort-key="adjusted_pred"><span>補正Pred</span><span class="sort-mark"></span></button></th>
                <th><button type="button" data-sort-key="bpm"><span>BPM</span><span class="sort-mark"></span></button></th>
                <th><button type="button" data-sort-key="features"><span>Feature</span><span class="sort-mark"></span></button></th>
              </tr>
            </thead>
            <tbody id="targetTableBody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <button class="load-more" id="targetLoadMoreButton" type="button" hidden>さらに表示</button>
        </div>
        </div>
      </div>
    </section>
  </main>
  <button id="targetScrollTopButton" class="scroll-top-button" type="button" aria-label="ページ上部へ戻る" hidden>↑</button>
</body>
</html>
