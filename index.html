<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SP☆8-☆12 非公式難易度予測表(&beta;)</title>
  <meta name="description" content="SP☆8-☆12 非公式難易度予測表(&beta;)の一覧サイトです。">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-M0BX4638PS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-M0BX4638PS');
  </script>
  <link rel="stylesheet" href="styles.css?v=20260821-17">
  <link rel="stylesheet" href="menu.css">
  <script defer src="menu.js"></script>
  <script defer src="data.js?v=20260821-4"></script>
  <script defer src="app.js?v=20260821-4"></script>
</head>
<body data-page="main">
  <main class="app">
    <header class="masthead">
      <div class="masthead__bar">
        <div class="site-menu" id="menuRoot">
          <button
            id="menuButton"
            class="menu-button"
            type="button"
            aria-label="メニューを開く"
            aria-controls="siteMenu"
            aria-expanded="false"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div id="siteMenu" class="menu-popover" hidden>
            <button type="button" class="menu-item" data-page="main" data-href="index.html">Main</button>
            <button type="button" class="menu-item" data-page="about" data-href="about.html">About</button>
            <button type="button" class="menu-item" data-page="history" data-href="history.html">更新履歴</button>
          </div>
        </div>
        <h1>SP☆8-☆12 <span class="title-lock">非公式難易度予測表(&beta;)</span></h1>
      </div>
    </header>

    <section id="mainView" class="view view--main" aria-live="polite">
      <div class="panel">
        <div class="toolbar">
          <label class="search">
            <span>Title</span>
            <input id="searchInput" type="search" placeholder="search title">
          </label>
          <div class="multi-filter level-filter">
            <span>Level</span>
            <details id="origFilterDetails" class="multi-filter__details">
              <summary id="origFilterSummary">all</summary>
              <div id="origFilterOptions" class="multi-filter__options"></div>
            </details>
          </div>
          <div class="multi-filter bpm-filter">
            <span>Difficulty</span>
            <details id="difficultyFilterDetails" class="multi-filter__details">
              <summary id="difficultyFilterSummary">all</summary>
              <div id="difficultyFilterOptions" class="multi-filter__options"></div>
            </details>
          </div>
          <div class="multi-filter feature-filter">
            <span>Feature</span>
            <details id="featureFilterDetails" class="multi-filter__details">
              <summary id="featureFilterSummary">all</summary>
              <div id="featureFilterOptions" class="multi-filter__options"></div>
            </details>
          </div>
          <details class="multi-filter__details advanced-filter">
            <summary id="advancedFilterSummary">詳細絞り込み</summary>
            <div class="advanced-filter__body">
              <label class="filter bpm-filter">
                <span>BPM_Min</span>
                <input id="bpmMinFilter" type="number" inputmode="decimal" min="0" step="any" value="0">
              </label>
              <label class="filter bpm-filter">
                <span>BPM_Max</span>
                <input id="bpmMaxFilter" type="number" inputmode="decimal" min="0" step="any" value="999">
              </label>
              <label class="filter pred-filter">
                <span>Pred_Min</span>
                <input id="predMinFilter" type="number" inputmode="decimal" min="0" max="999" step="0.1" value="0.0">
              </label>
              <label class="filter pred-filter">
                <span>Pred_Max</span>
                <input id="predMaxFilter" type="number" inputmode="decimal" min="0" max="999" step="0.1" value="999.0">
              </label>
            </div>
          </details>
</div>

        <p class="table-hint">曲名をタップすると詳細ページに移動します<br>表は左右にスクロールできます（モバイル表示時）</p>
        <div id="rowCount" class="row-count" aria-live="polite"></div>
        <div id="tableShell" class="table-shell">
          <table>
            <colgroup>
              <col class="col-orig">
              <col class="col-title">
              <col class="col-pred">
              <col class="col-bpm">
              <col class="col-features">
            </colgroup>
            <thead>
              <tr>
                <th><button type="button" data-sort-key="original_level"><span>Level</span><span class="sort-mark"></span></button></th>
                <th><button type="button" data-sort-key="title"><span>Title</span><span class="sort-mark"></span></button></th>
                <th><button type="button" data-sort-key="calibrated_pred_skill"><span>Pred</span><span class="sort-mark"></span></button></th>
                <th><button type="button" data-sort-key="bpm"><span>BPM</span><span class="sort-mark"></span></button></th>
                <th><button type="button" data-sort-key="features"><span>Feature</span><span class="sort-mark"></span></button></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <button id="scrollTopButton" class="scroll-top-button" type="button" aria-label="ページ上部へ戻る" hidden>↑</button>
</body>
</html>
