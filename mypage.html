<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マイページ</title>
  <meta name="description" content="クリアランプ記録を絞り込んで確認するマイページです。">
  <link rel="canonical" href="https://cpi-next.com/mypage.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cpi-next.com/mypage.html">
  <meta property="og:site_name" content="CPI:Next">
  <meta property="og:title" content="マイページ">
  <meta property="og:description" content="クリアランプ記録を絞り込んで確認するマイページです。">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/jpeg" href="site-icon.jpg">
  <link rel="apple-touch-icon" href="site-icon.jpg">
  <meta property="og:image" content="https://cpi-next.com/site-icon.jpg">
  <meta property="og:image:secure_url" content="https://cpi-next.com/site-icon.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1254">
  <meta property="og:image:height" content="1254">
  <meta property="og:image:alt" content="CPI:Next">
  <meta name="twitter:image" content="https://cpi-next.com/site-icon.jpg">
  <meta name="twitter:image:alt" content="CPI:Next">
  <!-- Google Analytics -->
  <script defer src="analytics.js?v=20260904-1"></script>
  <link rel="stylesheet" href="styles.css?v=20260904-1">
<link rel="stylesheet" href="mypage.css?v=20260904-1">
  <link rel="stylesheet" href="menu.css">
  <script defer src="menu.js?v=20260904-1"></script>
  <script defer src="data.js?v=20260904-1"></script>
  <script defer src="app.js?v=20260904-1"></script>
  <script defer src="mypage.js?v=20260904-1"></script>
</head>
<body data-page="mypage">
  <main class="app">
    <header class="masthead">
      <div class="masthead__bar">
        <div class="site-menu" id="menuRoot">
          <button
            id="menuButton"
            class="menu-button"
            type="button"
            aria-label="メニューを開く"
            aria-controls="siteMenu"
            aria-expanded="false"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div id="siteMenu" class="menu-popover" hidden>
            <button type="button" class="menu-item" data-page="main" data-href="index.html">Pred難易度表</button>
            <button type="button" class="menu-item" data-page="about" data-href="about.html">About</button>
            <button type="button" class="menu-item" data-page="diagnosis" data-href="diagnosis.html">適正診断</button>
            <button type="button" class="menu-item" data-page="history" data-href="history.html">サイト更新履歴</button>
          </div>
        </div>
        <h1>マイページ</h1>
      </div>
    </header>

    <section class="view view--mypage" aria-live="polite">
      <div class="panel mypage-panel">
        <div class="mypage-pred-estimate" aria-live="polite">
          <p class="mypage-pred-estimate__label">推定適正<span class="chart-detail__label-group" data-tooltip="推定ノマゲ難易度です。FAILED/ASSISTED/EASYを未クリア、CLEAR/HARD以上をクリアとして独自に計算しています。" tabindex="0" role="button" aria-label="Predの説明"><span>Pred</span><span class="chart-detail__info-mark" aria-hidden="true">ⓘ</span></span></p>
          <p id="mypagePredEstimate" class="mypage-pred-estimate__value">ー</p>
          <p id="mypagePredEstimateNote" class="mypage-pred-estimate__note" hidden></p>
          <div class="mypage-status-distribution">
            <h3 class="mypage-status-distribution__title">レベル別クリア状況</h3>
            <div class="mypage-status-distribution__controls">
              <label>未登録を含む<input id="mypageIncludeUnregistered" type="checkbox"></label>
              <label>未所持・未解禁を含む<input id="mypageIncludeUnowned" type="checkbox"></label>
            </div>
            <div id="mypageStatusDistributionChart" class="mypage-status-distribution__chart" role="list" aria-label="レベル別クリア状況"></div>
            <div id="mypageStatusDistributionLegend" class="mypage-status-distribution__legend" role="list" aria-label="Statusの凡例"></div>
          </div>
          <section id="mypageFeatureResult" class="mypage-status-distribution mypage-feature-result" aria-labelledby="mypageFeatureResultTitle" hidden>
            <h3 id="mypageFeatureResultTitle" class="mypage-status-distribution__title mypage-feature-result__title">譜面傾向</h3>
            <p class="mypage-feature-result__note">同程度のPredの譜面と比べた、譜面特徴ごとの得意・不得意の傾向です。</p>
            <div id="mypageFeatureBars" class="mypage-feature-bars"></div>
          </section>
          <div class="mypage-share">
            <a id="mypageShareButton" class="mypage-share__button" href="#" target="_blank" rel="noopener noreferrer" hidden>Xで共有</a>
          </div>
        </div>

        <h2 class="mypage-section-heading">クリア状況詳細</h2>
        <details class="filter-group">
          <summary>絞り込み</summary>
          <div class="filter-group__body">
            <div class="toolbar mypage-toolbar">
          <label class="search">
            <span>Title</span>
            <input id="mypageSearchInput" type="search" placeholder="search title" autocomplete="off">
          </label>

          <div class="multi-filter mypage-status-filter">
            <span>Status</span>
            <details id="mypageStatusFilterDetails" class="multi-filter__details mypage-filter-details">
              <summary id="mypageStatusFilterSummary">5 selected</summary>
              <div id="mypageStatusFilterOptions" class="multi-filter__options"></div>
            </details>
          </div>

          <div class="multi-filter level-filter">
            <span>Level</span>
            <details id="mypageLevelFilterDetails" class="multi-filter__details mypage-filter-details">
              <summary id="mypageLevelFilterSummary">all</summary>
              <div id="mypageLevelFilterOptions" class="multi-filter__options"></div>
            </details>
          </div>

          <div class="multi-filter bpm-filter">
            <span>Difficulty</span>
            <details id="mypageDifficultyFilterDetails" class="multi-filter__details mypage-filter-details">
              <summary id="mypageDifficultyFilterSummary">all</summary>
              <div id="mypageDifficultyFilterOptions" class="multi-filter__options"></div>
            </details>
          </div>

          <div class="multi-filter feature-filter">
            <span>Feature</span>
            <details id="mypageFeatureFilterDetails" class="multi-filter__details mypage-filter-details">
              <summary id="mypageFeatureFilterSummary">all</summary>
              <div id="mypageFeatureFilterOptions" class="multi-filter__options"></div>
            </details>
          </div>

          <details class="multi-filter__details advanced-filter mypage-filter-details">
            <summary id="mypageAdvancedFilterSummary">詳細絞り込み</summary>
            <div class="advanced-filter__body">
              <label class="filter bpm-filter">
                <span>BPM_Min</span>
                <input id="mypageBpmMinFilter" type="number" inputmode="decimal" min="0" max="999" step="any" value="0">
              </label>
              <label class="filter bpm-filter">
                <span>BPM_Max</span>
                <input id="mypageBpmMaxFilter" type="number" inputmode="decimal" min="0" max="999" step="any" value="999">
              </label>
              <label class="filter pred-filter">
                <span>Pred_Min</span>
                <input id="mypagePredMinFilter" type="number" inputmode="decimal" min="0" max="999" step="0.1" value="0.0">
              </label>
              <label class="filter pred-filter">
                <span>Pred_Max</span>
                <input id="mypagePredMaxFilter" type="number" inputmode="decimal" min="0" max="999" step="0.1" value="999.0">
              </label>
            </div>
          </details>
            </div>
          </div>
        </details>

        <p class="table-hint">曲名をタップすると詳細ページに移動します<br>表は左右にスクロールできます（モバイル表示時）</p>
        <p id="mypageMessage" class="mypage-message" role="status" aria-live="polite" hidden></p>
        <div id="mypageRowCount" class="row-count" aria-live="polite"></div>
        <div id="mypageTableShell" class="table-shell">
          <table id="mypageTable" class="chart-table">
            <colgroup>
              <col class="col-memo">
              <col class="col-orig">
              <col class="col-title">
              <col class="col-pred">
              <col class="mypage-col-status">
              <col class="col-bpm">
              <col class="col-features">
            </colgroup>
            <thead>
              <tr>
                <th class="memo-heading">Memo</th>
                <th><button type="button" data-sort-key="original_level"><span>Level</span><span class="sort-mark"></span></button></th>
                <th><button type="button" data-sort-key="title"><span>Title</span><span class="sort-mark"></span></button></th>
                <th><button type="button" data-sort-key="calibrated_pred_skill"><span>Pred</span><span class="sort-mark"></span></button></th>
                <th><button type="button" data-sort-key="status"><span>Status</span><span class="sort-mark"></span></button></th>
                <th><button type="button" data-sort-key="bpm"><span>BPM</span><span class="sort-mark"></span></button></th>
                <th><button type="button" data-sort-key="features"><span>Feature</span><span class="sort-mark"></span></button></th>
              </tr>
            </thead>
            <tbody id="mypageTableBody"></tbody>
          </table>
        </div>
        <div class="mypage-pagination">
          <button id="mypageLoadMoreButton" class="mypage-load-more" type="button" hidden>さらに表示</button>
        </div>
      </div>
    </section>
  </main>
  <button id="mypageScrollTopButton" class="scroll-top-button" type="button" aria-label="ページ上部へ戻る" hidden>↑</button>
</body>
</html>
